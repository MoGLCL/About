<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menna Sultan | Hero Section</title>
    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================ -->
    <!-- HERO / INTRODUCTION SECTION (PORTFOLIO COMPONENT)            -->
    <!-- ============================================================ -->
    <section class="hero-section" id="hero-section">
        <!-- Background Decorators / Ambient Light -->
        <div class="ambient-glow glow-top-left"></div>
        <div class="ambient-glow glow-bottom-right"></div>
        <div class="grid-overlay"></div>

        <!-- Floating Light / Dark Theme Switcher -->
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Light/Dark Theme">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span class="theme-text">Girly Light</span>
        </button>

        <div class="hero-container">
            <!-- LEFT COLUMN: Personal Info & Call to Action -->
            <div class="hero-left reveal-element">
                <!-- Name & Title -->
                <h1 class="hero-name">
                    Menna <span class="text-gradient">Sultan</span>
                </h1>

                <!-- Dynamic Typing Role -->
                <div class="hero-role-container">
                    <span class="role-prefix">I am a </span>
                    <span class="typing-text" id="typing-text"></span>
                    <span class="typing-cursor"></span>
                </div>

                <!-- Bio Description -->
                <p class="hero-description">
                    I enjoy building responsive and modern web interfaces.
                    I love learning new technologies and improving my coding skills.
                    Currently learning how to write clean and maintainable code.
                </p>

                <!-- Action Buttons -->
                <div class="hero-buttons">
                    <a href="CV.pdf" download class="btn btn-primary">
                        <span class="btn-text">Download CV</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </a>
                    <a href="#contact" class="btn btn-secondary">
                        <span class="btn-text">Contact Me</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- RIGHT COLUMN: Profile Card & Interactive Floating Skills -->
            <div class="hero-right reveal-element">
                <div class="profile-card" id="profile-card">
                    <!-- Glassmorphism Highlight Effects -->
                    <div class="glass-shine"></div>
                    <div class="card-border-glow"></div>

                    <!-- Center Avatar Container -->
                    <div class="avatar-container">
                        <div class="avatar-glowing-ring"></div>
                        <div class="avatar-circle">
                            <img src="https://avatars.githubusercontent.com/u/241636270?v=4" alt="Menna Sultan" class="avatar-img">
                        </div>
                    </div>

                    <!-- Floating Skill Cards Orbiting Avatar -->
                    <div class="skill-card skill-card-1 float-anim-1">
                        <div class="skill-icon html-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
                        </div>
                        <span class="skill-name">HTML</span>
                    </div>

                    <div class="skill-card skill-card-2 float-anim-2">
                        <div class="skill-icon css-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <span class="skill-name">CSS</span>
                    </div>

                    <div class="skill-card skill-card-3 float-anim-3">
                        <div class="skill-icon js-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        </div>
                        <span class="skill-name">JavaScript</span>
                    </div>

                    <div class="skill-card skill-card-4 float-anim-1">
                        <div class="skill-icon php-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        </div>
                        <span class="skill-name">PHP</span>
                    </div>

                    <div class="skill-card skill-card-5 float-anim-2">
                        <div class="skill-icon csharp-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        </div>
                        <span class="skill-name">C#</span>
                    </div>

                    <div class="skill-card skill-card-6 float-anim-3">
                        <div class="skill-icon vibe-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        </div>
                        <span class="skill-name">Vibe Coding</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
